plugins {
    id 'java'
}

group = 'io.github.tejedu'

def jarBaseName = 'ManHunt'

// plugin.yml is the single source of truth for the version — Spigot reads
// it from there at runtime, so the jar/project version is derived from it
// instead of being duplicated here. To bump the version, edit plugin.yml.
// Extracted with a regex (rather than a full YAML parse) since this is the
// project's only YAML-reading need; it copes with a trailing comment or
// quoted value on the line, unlike a plain string-slice.
def versionLine = file('plugin.yml').readLines().find { it.trim().startsWith('version:') }
if (versionLine == null) {
    throw new GradleException("plugin.yml is missing a 'version:' line")
}
def versionMatch = versionLine =~ /version:\s*['"]?([^'"#]+?)['"]?\s*(#.*)?$/
if (!versionMatch) {
    throw new GradleException("Couldn't parse a version out of plugin.yml's '${versionLine}' line")
}
version = versionMatch[0][1]

// Target Java 25 bytecode — the newest release both the Spigot 26.2 server
// itself requires (Minecraft 26.1+ needs a Java 25+ JVM to run) and the
// Gradle wrapper here (9.7.0) fully supports. Using --release lets any
// modern JDK cross-compile without needing a JDK 25 toolchain
// installed/downloaded.
tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

// Source lives in ./src, not the Maven-standard src/main/java layout.
// (Tests use the conventional src/test/java, so it's excluded here to
// avoid main picking up test sources — srcDirs scans recursively.)
sourceSets {
    main {
        java {
            srcDirs = ['src']
            exclude 'test/**'
        }
        resources {
            // plugin.yml and config.yml live at the project root and get
            // bundled at the root of the jar, matching the old ant build.
            srcDirs = ['.']
            include 'plugin.yml', 'config.yml'
        }
    }
}

repositories {
    mavenCentral()
    maven {
        // Spigot's own repo — resolves the spigot-api snapshot dependency
        // below directly, no local jar needed.
        url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/'
    }
    maven {
        // Paper's repo — MockBukkit (test-only) pulls in paper-api as a
        // snapshot dependency that isn't mirrored on Maven Central.
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

dependencies {
    // The Spigot API is provided by the server at runtime, so it's
    // compile-only and never bundled into the plugin jar. Resolved directly
    // from Spigot's snapshot repo (see repositories{} above) rather than a
    // vendored jar in lib/.
    compileOnly 'org.spigotmc:spigot-api:26.2-R0.1-SNAPSHOT'

    // MockBukkit spins up a fake server so plugin code can be unit tested
    // without a real Minecraft server. It only provides the mock
    // implementations (ServerMock, PlayerMock, ...); the actual org.bukkit
    // API interfaces come from a separately-declared paper-api matching its
    // pin, below. Pinned to v26.2 matching Spigot 26.2.
    testImplementation 'org.mockbukkit.mockbukkit:mockbukkit-v26.2:4.117.0'
    // Paper switched to a <mcversion>.build.<N>-<stability> version scheme
    // (no more -R0.1-SNAPSHOT) - this exact build is what the MockBukkit jar
    // above is built against (check its META-INF/MANIFEST.MF Paper-Version
    // attribute if bumping either dependency).
    testImplementation 'io.papermc.paper:paper-api:26.2.build.133-stable'
    testImplementation platform('org.junit:junit-bom:5.11.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

jar {
    archiveBaseName = jarBaseName
    archiveVersion = version
    // Drop the jar in the project root, matching the old ant build's output
    // location (ManHunt-<version>.jar), instead of the default build/libs.
    destinationDirectory = projectDir

    manifest {
        attributes(
            'Built-By': System.getProperty('user.name'),
            'Built-Date': new Date().format("yyyyMMdd, HHmm")
        )
    }
}

tasks.named('clean') {
    delete fileTree(projectDir) {
        include "${jarBaseName}-*.jar"
    }
}
