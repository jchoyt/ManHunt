name: CI

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The Gradle wrapper (pinned to 9.7.0, see gradle/wrapper/gradle-wrapper.properties)
      # is what actually runs the build below; this just needs a JDK on the
      # PATH for the wrapper's launcher and to match the project's Java 25
      # target (see build.gradle / NOTES.md's "Build system" section).
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # Caches the Gradle wrapper distribution, dependencies, and build
      # outputs between runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Compiles, assembles the plugin jar, and runs the MockBukkit test
      # suite (part of Gradle's `check`, which `build` depends on).
      - name: Build and test
        run: ./gradlew build
